appId: com.sandakannipunajith.nora
productName: Sita
executableName: Sita
copyright: Copyright © 2024 Sandakan Nipunajith
icon: ./build/icon.ico
artifactName: '${productName} v${version}-${os}-${arch}.${ext}'
afterPack: ./scripts/afterPack.cjs

extraMetadata:
  description: Sita

directories:
  buildResources: build

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!**/*.STALE*'
      - '!**/*.bak'
      - '!**/*.tmp'

files:
  - '!**/.vscode/*'
  - '!**/.idea/*'
  - '!src/**/*'
  - '!test/**/*'
  - '!target/**/*'
  - '!crates/**/*'
  - '!scripts/**/*'
  - '!docs/**/*'
  - '!audits/**/*'
  - '!audit-artifacts/**/*'
  - '!architecture/**/*'
  - '!.agents/**/*'
  - '!sqlite-poc/**/*'
  - '!temp/**/*'
  - '!test-results/**/*'
  - '!scratch/**/*'
  - '!{Cargo.toml,Cargo.lock}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.oxfmtrc.json,.oxlintrc.json,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,TODO.md,todo.md,PROJECT.md,CODE_OF_CONDUCT.md,PRIVACY-POLICY.md,TEST_INFRA.md,TEST_READY.md,AUDIT_*.md,PERFORMANCE_*.md,currproblems.md,coreTask.md,codeReview.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json,*.tsbuildinfo}'
  - '!{vitest.config.ts,drizzle.config.ts,tsr.config.json,tailwind.config.js}'
  - '!{*.patch,*.log,*.zip,*.diff,audit_*.json,current_*.json,deep_*.json,memory_*.json,test_semver.js}'
  - '!**/resources/other/*'
  - '!**/resources/installer_assets/*'

asarUnpack:
  - resources/**
  - node_modules/sharp/**/*
  - node_modules/@img/**/*

fileAssociations:
  - ext: mp3
    icon: ./build/installer_assets/file_associated_icons/mp3.ico
    mimeType: audio/mpeg
    role: Editor
  - ext: wav
    icon: ./build/installer_assets/file_associated_icons/wav.ico
    mimeType: audio/wav
    role: Editor
  - ext: ogg
    icon: ./build/installer_assets/file_associated_icons/ogg.ico
    mimeType: audio/ogg
    role: Editor
  - ext: aac
    icon: ./build/installer_assets/file_associated_icons/aac.ico
    mimeType: audio/aac
    role: Editor
  - ext: m4r
    icon: ./build/installer_assets/file_associated_icons/m4r.ico
    mimeType: audio/x-m4r
    role: Editor
  - ext: flac
    icon: ./build/installer_assets/file_associated_icons/flac.ico
    mimeType: audio/flac
    role: Editor
  - ext: opus
    icon: ./build/installer_assets/file_associated_icons/opus.ico
    mimeType: audio/ogg
    role: Editor
  - ext: m4a
    icon: ./build/installer_assets/file_associated_icons/m4a.ico
    mimeType: audio/mp4
    role: Editor

win:
  executableName: Sita
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  shortcutName: '${productName}'
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: ./build/icon.ico
  installerSidebar: ./build/installer_assets/sidebar.bmp
  license: ./LICENSE.txt
  oneClick: false
  perMachine: false
  uninstallerIcon: ./build/icon.ico

mac:
  category: public.app-category.music
  darkModeSupport: true
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  hardenedRuntime: true
  icon: ./build/icon.icns
  extendInfo:
    - NSCameraUsageDescription: "Application requests access to the device's camera."
    - NSMicrophoneUsageDescription: "Application requests access to the device's microphone."
    - NSDocumentsFolderUsageDescription: "Application requests access to the user's Documents folder."
    - NSDownloadsFolderUsageDescription: "Application requests access to the user's Downloads folder."
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
    # - dir
  category: AudioVideo
  synopsis: 'An elegant music player built using Electron and React. Inspired by Oto Music for Android by Piyush Mamidwar.'

npmRebuild: false

protocols:
  name: nora-protocol
  schemes:
    - nora
